<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KAPA Bank — Traditional Chen ER Diagram</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .header {
      max-width: 1200px;
      width: 100%;
      margin-bottom: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
    }
    h1 { margin: 0; font-size: 24px; font-weight: 700; color: #38bdf8; }
    p { margin: 4px 0 0 0; color: #94a3b8; font-size: 14px; }
    .btn-group { display: flex; gap: 10px; }
    .btn {
      background: #2563eb;
      color: white;
      text-decoration: none;
      padding: 10px 18px;
      border-radius: 8px;
      font-weight: 600;
      font-size: 14px;
      transition: background 0.2s;
    }
    .btn:hover { background: #1d4ed8; }
    .btn-secondary {
      background: #334155;
      color: #f1f5f9;
    }
    .btn-secondary:hover { background: #475569; }
    .diagram-container {
      max-width: 1450px;
      width: 100%;
      background: #ffffff;
      border-radius: 12px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5);
      overflow: hidden;
      padding: 10px;
    }
    svg {
      width: 100%;
      height: auto;
      display: block;
    }
  </style>
</head>
<body>
  <div class="header">
    <div>
      <h1>KAPA Bank — Traditional Chen ER Diagram</h1>
      <p>Official Academic Model conforming strictly to Peter Chen notation standards</p>
    </div>
    <div class="btn-group">
      <a href="static/er_diagram.svg" download="kapa_bank_er_diagram.svg" class="btn">Download SVG File</a>
      <a href="javascript:window.print()" class="btn btn-secondary">Print / Save as PDF</a>
    </div>
  </div>

  <div class="diagram-container">
    <object data="static/er_diagram.svg" type="image/svg+xml" style="width:100%; height:auto;">
      <embed src="static/er_diagram.svg" type="image/svg+xml" />
    </object>
  </div>
</body>
</html>
